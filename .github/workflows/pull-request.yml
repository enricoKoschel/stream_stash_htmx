name: Pull request checks

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # build.rs needs the Tailwind CLI
      - name: Download Tailwind and daisyUI
        run: ./download_tailwind.sh

      # sqlx macros check queries at compile time against DATABASE_URL
      - name: Create build database
        run: |
          for migration in migrations/*.up.sql; do
            sqlite3 stream_stash.db < "$migration"
          done

      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
        env:
          DATABASE_URL: sqlite:stream_stash.db
